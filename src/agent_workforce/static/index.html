<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crew</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Crew</h1>
    <div id="infrastructure"></div>
    <span id="ledger-badge"></span>
    <span id="usage-badge"></span>
    <label id="budget-control">Daily budget $<input id="budget-input" type="number" min="0" step="0.01" placeholder="none"></label>
    <label id="recovery-control">Recovery below $<input id="recovery-input" type="number" min="0" step="0.01" placeholder="none"></label>
    <button id="emergency-stop-btn">Emergency stop</button>
    <button id="build-agent-btn">🧭 Orchestrator: build agent</button>
    <button id="recruit-btn">+ Recruit agent</button>
    <button id="orchestrator-chat-btn">💬 Ask Orchestrator</button>
  </header>

  <main id="floor"></main>

  <section id="opportunities-section">
    <div class="section-header">
      <h2>Opportunities</h2>
      <div>
        <button id="discover-opportunities-btn">Ask Orchestrator to discover</button>
        <button id="new-opportunity-btn">+ New opportunity</button>
      </div>
    </div>
    <div id="opportunities"></div>
  </section>

  <section id="missions-section">
    <div class="section-header">
      <h2>Missions</h2>
      <button id="new-mission-btn">+ New mission</button>
    </div>
    <div id="missions"></div>
  </section>

  <section id="pipelines-section">
    <div class="section-header">
      <h2>Pipelines</h2>
      <button id="new-pipeline-btn">+ New pipeline</button>
    </div>
    <div id="pipelines"></div>
  </section>

  <section id="activity-section">
    <div class="section-header">
      <h2>Activity</h2>
    </div>
    <ul id="activity-feed"></ul>
  </section>

  <dialog id="recruit-dialog">
    <form id="recruit-form">
      <h2>Recruit an agent</h2>
      <label>Name <input name="name" required></label>
      <label>Role
        <select name="role">
          <option>Researcher</option>
          <option>Engineer</option>
          <option>Writer</option>
          <option>Analyst</option>
        </select>
      </label>
      <label>Avatar <input name="avatar" value="🤖" maxlength="2"></label>
      <label>Provider
        <select name="provider" id="recruit-provider">
          <option value="groq">Groq</option>
        </select>
      </label>
      <label>Model <input name="model" id="recruit-model" value="openai/gpt-oss-120b"></label>
      <label>Instructions <textarea name="instructions" rows="3" placeholder="You are a diligent researcher..."></textarea></label>
      <div class="actions">
        <button type="button" id="recruit-cancel">Cancel</button>
        <button type="submit">Recruit</button>
      </div>
    </form>
  </dialog>

  <dialog id="task-dialog">
    <form id="task-form">
      <h2 id="task-dialog-title">Assign a task</h2>
      <textarea name="input" rows="3" placeholder="Research the top 5 competitors and summarize them." required></textarea>
      <div class="actions">
        <button type="button" id="task-cancel">Cancel</button>
        <button type="submit">Assign</button>
      </div>
    </form>
    <button type="button" id="task-abort" class="btn-danger" hidden>Cancel task</button>
    <div id="task-output"></div>
    <h3 class="history-heading">History</h3>
    <div id="task-history"></div>
  </dialog>

  <dialog id="pipeline-dialog">
    <form id="pipeline-form">
      <h2>New pipeline</h2>
      <label>Name <input name="name" required placeholder="Research then write"></label>
      <div id="pipeline-steps"></div>
      <button type="button" id="pipeline-add-step">+ Add step</button>
      <div class="actions">
        <button type="button" id="pipeline-cancel">Cancel</button>
        <button type="submit">Create</button>
      </div>
    </form>
  </dialog>

  <dialog id="automation-dialog">
    <form id="automation-form">
      <h2 id="automation-dialog-title">Schedule pipeline</h2>
      <label>Frequency
        <select name="schedule_type" id="automation-schedule-type">
          <option value="interval">Every N minutes</option>
          <option value="daily">Daily at a time</option>
        </select>
      </label>
      <label id="automation-interval-field">Minutes <input name="interval_minutes" type="number" min="1" value="60"></label>
      <label id="automation-daily-field" style="display:none">Time <input name="daily_at" type="time" value="09:00"></label>
      <textarea name="input" rows="3" placeholder="Input to feed the first step each run..." required></textarea>
      <div class="actions">
        <button type="button" id="automation-cancel">Cancel</button>
        <button type="submit">Schedule</button>
      </div>
    </form>
    <div id="automation-list"></div>
  </dialog>

  <dialog id="opportunity-dialog">
    <form id="opportunity-form">
      <h2>New opportunity</h2>
      <label>Title <input name="title" required placeholder="Docs SaaS"></label>
      <label>Description <textarea name="description" rows="3" placeholder="What it is and how it makes money."></textarea></label>
      <label>Forecast value ($) <input name="forecast_value" type="number" step="0.01" min="0"></label>
      <div class="actions">
        <button type="button" id="opportunity-cancel">Cancel</button>
        <button type="submit">Create</button>
      </div>
    </form>
  </dialog>

  <dialog id="discover-dialog">
    <form id="discover-form">
      <h2>Ask the Orchestrator to discover opportunities</h2>
      <textarea name="hint" rows="3" placeholder="Optional focus area, e.g. 'developer tools'"></textarea>
      <div class="actions">
        <button type="button" id="discover-cancel">Cancel</button>
        <button type="submit">Discover</button>
      </div>
    </form>
  </dialog>

  <dialog id="orchestrator-dialog">
    <h2>Orchestrator</h2>
    <div id="orchestrator-messages"></div>
    <form id="orchestrator-form">
      <textarea name="question" rows="2" placeholder="What should I focus on?" required></textarea>
      <div class="actions">
        <button type="button" id="orchestrator-close">Close</button>
        <button type="submit">Ask</button>
      </div>
    </form>
  </dialog>

  <dialog id="mission-dialog">
    <form id="mission-form">
      <h2>Give the workforce an objective</h2>
      <div id="mission-templates" class="mission-templates"></div>
      <textarea name="objective" rows="3" placeholder="Every Monday, research our top competitors, note what changed, and write a report." required></textarea>
      <div class="actions">
        <button type="button" id="mission-cancel">Cancel</button>
        <button type="submit">Propose plan</button>
      </div>
    </form>
    <div id="mission-preview"></div>
  </dialog>

  <dialog id="pipeline-run-dialog">
    <form id="pipeline-run-form">
      <h2 id="pipeline-run-title">Run pipeline</h2>
      <textarea name="input" rows="3" placeholder="Input for the first step..." required></textarea>
      <div class="actions">
        <button type="button" id="pipeline-run-cancel">Cancel</button>
        <button type="submit">Run</button>
      </div>
    </form>
    <button type="button" id="pipeline-run-abort" class="btn-danger" hidden>Cancel run</button>
    <div id="pipeline-run-progress"></div>
  </dialog>

  <script src="/bundle.js"></script>
</body>
</html>
